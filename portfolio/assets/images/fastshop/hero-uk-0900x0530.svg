<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="900" height="530" fill="#F7F4EC"/>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6E1D2" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2A2A2A"/></marker></defs>
  <rect width="900" height="530" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="46" fill="#168A53"/>
  <text x="22" y="30" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="0.4">FASTSHOP — ШВИДКИЙ МАГАЗИН НА OPENCART</text>
  <text x="878" y="30" fill="#FFFFFF" font-size="12" text-anchor="end">OpenCart 3 · PHP 8 · MySQL · Redis · WebP</text>
  <g font-size="12">
    <rect x="24" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="99.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">КАТАЛОГ</text>
    <text x="99.0" y="140" text-anchor="middle" font-weight="700" font-size="12">30 000 товарів</text>
    <text x="99.0" y="156" text-anchor="middle" font-weight="700" font-size="12">12 категорій</text>
    <line x1="38" y1="168" x2="160" y2="168" stroke="#DDD"/>
    <text x="99.0" y="186" text-anchor="middle" fill="#666" font-size="10">бренди · характеристики</text>
    <text x="99.0" y="200" text-anchor="middle" fill="#666" font-size="10">ЧПУ-адреси</text>
    <line x1="174" y1="155" x2="212" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="212" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="212" y="90" width="150" height="28" rx="6" fill="#E67E22"/>
    <text x="287.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">ІНДЕКС ФІЛЬТРІВ</text>
    <text x="287.0" y="140" text-anchor="middle" font-weight="700" font-size="12">бренд · ціна</text>
    <text x="287.0" y="156" text-anchor="middle" font-weight="700" font-size="12">характеристики</text>
    <line x1="226" y1="168" x2="348" y2="168" stroke="#DDD"/>
    <text x="287.0" y="186" text-anchor="middle" fill="#666" font-size="10">лічильники значень,</text>
    <text x="287.0" y="200" text-anchor="middle" fill="#666" font-size="10">слідує за адмінкою</text>
    <line x1="362" y1="155" x2="400" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="400" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="400" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="475.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">REDIS-КЕШ</text>
    <text x="475.0" y="140" text-anchor="middle" font-weight="700" font-size="12">дані сторінок,</text>
    <text x="475.0" y="156" text-anchor="middle" font-weight="700" font-size="12">з версією</text>
    <line x1="414" y1="168" x2="536" y2="168" stroke="#DDD"/>
    <text x="475.0" y="186" text-anchor="middle" fill="#666" font-size="10">скидається при</text>
    <text x="475.0" y="200" text-anchor="middle" fill="#666" font-size="10">кожній правці</text>
    <line x1="550" y1="155" x2="588" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="588" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="588" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="663.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">ЛЕГКА ТЕМА</text>
    <text x="663.0" y="140" text-anchor="middle" font-weight="700" font-size="12">≈ 26 КБ сторінка</text>
    <text x="663.0" y="156" text-anchor="middle" font-weight="700" font-size="12">без jQuery</text>
    <line x1="602" y1="168" x2="724" y2="168" stroke="#DDD"/>
    <text x="663.0" y="186" text-anchor="middle" fill="#666" font-size="10">WebP-зображення,</text>
    <text x="663.0" y="200" text-anchor="middle" fill="#666" font-size="10">inline CSS</text>
    <line x1="738" y1="155" x2="776" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="776" y="90" width="102" height="130" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2.5"/>
    <rect x="776" y="90" width="102" height="28" rx="6" fill="#168A53"/>
    <text x="827.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10">ЧЕКАУТ</text>
    <text x="827.0" y="140" text-anchor="middle" font-weight="700" font-size="11">одна сторінка</text>
    <text x="827.0" y="156" text-anchor="middle" font-weight="700" font-size="11">+ вибір НП</text>
    <line x1="790" y1="168" x2="864" y2="168" stroke="#DDD"/>
    <text x="827.0" y="186" text-anchor="middle" fill="#666" font-size="9">замовлення</text>
    <text x="827.0" y="200" text-anchor="middle" fill="#666" font-size="9">в адмінці</text>
  </g>
  <rect x="24" y="270" width="852" height="112" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
  <rect x="24" y="270" width="852" height="26" rx="6" fill="#2A2A2A"/>
  <text x="450" y="288" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="12" letter-spacing="0.6">ВИМІРЯНО ПРОТИ СТАНДАРТНОГО OPENCART, ТІ САМІ ДАНІ</text>
  <text x="44" y="322" font-weight="700" font-size="12.5">каталог 34 → 10 мс</text>
  <text x="44" y="342" fill="#666" font-size="10.5">пошук 267 → 5 мс</text>
  <text x="44" y="358" fill="#666" font-size="10.5">506 запитів/с (було 160)</text>
  <text x="328" y="322" font-weight="700" font-size="12.5">Lighthouse mobile 100</text>
  <text x="328" y="342" fill="#666" font-size="10.5">перше відображення</text>
  <text x="328" y="358" fill="#666" font-size="10.5">0,6–0,8 с (було 2,1–2,4 с)</text>
  <text x="612" y="322" font-weight="700" font-size="12.5">19–28 КБ на сторінку</text>
  <text x="612" y="342" fill="#666" font-size="10.5">(було 272–336 КБ)</text>
  <text x="612" y="358" fill="#666" font-size="10.5">фільтр за 3 умовами: 9 мс</text>
  <rect x="0" y="404" width="900" height="72" fill="#E4E7DA"/>
  <rect x="24" y="416" width="852" height="46" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2"/>
  <text x="44" y="444" fill="#168A53" font-weight="700" font-size="13">Фільтри з лічильниками й власними адресами — кожен стан фільтра це окрема сторінка.</text>
  <rect x="24" y="497" width="14" height="14" fill="#168A53"/>
  <text x="46" y="509" font-size="11" fill="#333">контроль системи</text>
  <rect x="404" y="497" width="14" height="14" fill="#E67E22"/>
  <text x="426" y="509" font-size="11" fill="#333">шлюз — без перевірки нічого не проходить</text>
</svg>