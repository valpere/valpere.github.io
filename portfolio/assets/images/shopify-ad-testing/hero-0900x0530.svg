<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="900" height="530" fill="#F7F4EC"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6E1D2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2A2A2A"/>
    </marker>
  </defs>
  <rect width="900" height="530" fill="url(#grid)"/>
  <!-- header -->
  <rect x="0" y="0" width="900" height="46" fill="#168A53"/>
  <text x="22" y="30" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="0.3">AI AD CAMPAIGNS — SHOPIFY LUXURY FASHION</text>
  <text x="878" y="30" fill="#FFFFFF" font-size="11" text-anchor="end">Go · PostgreSQL · Claude · Higgsfield · Meta</text>
  <!-- pipeline row -->
  <g font-size="11">
    <rect x="24" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="83.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">SHOPIFY</text>
    <text x="83.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">products · orders</text>
    <text x="83.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">stock · photos</text>
    <line x1="36" y1="162" x2="130" y2="162" stroke="#DDD"/>
    <text x="83.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">GraphQL Admin API</text>
    <text x="83.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">+ live webhooks</text>
    <line x1="142" y1="149" x2="171" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="171" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="171" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="230.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">CLAUDE</text>
    <text x="230.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">offer · angle</text>
    <text x="230.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">hook hypotheses</text>
    <line x1="183" y1="162" x2="277" y2="162" stroke="#DDD"/>
    <text x="230.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">schema-validated</text>
    <text x="230.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">structured output</text>
    <line x1="289" y1="149" x2="318" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="318" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="318" y="84" width="118" height="28" rx="6" fill="#E67E22"/>
    <text x="377.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">CHAT · BRIEF</text>
    <text x="377.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">agree the brief</text>
    <text x="377.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">approve · confirm</text>
    <line x1="330" y1="162" x2="424" y2="162" stroke="#DDD"/>
    <text x="377.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">proposals only —</text>
    <text x="377.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">the client confirms</text>
    <line x1="436" y1="149" x2="465" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="465" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="465" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="524.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">VIDEO</text>
    <text x="524.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">preview 720p →</text>
    <text x="524.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">final 1080p</text>
    <line x1="477" y1="162" x2="571" y2="162" stroke="#DDD"/>
    <text x="524.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">ffmpeg montage,</text>
    <text x="524.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">script check</text>
    <line x1="583" y1="149" x2="612" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="612" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="612" y="84" width="118" height="28" rx="6" fill="#E67E22"/>
    <text x="671.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">META ADS</text>
    <text x="671.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">campaign · ad set</text>
    <text x="671.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">ad — PAUSED</text>
    <line x1="624" y1="162" x2="718" y2="162" stroke="#DDD"/>
    <text x="671.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">caps set before</text>
    <text x="671.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">it can spend</text>
    <line x1="730" y1="149" x2="759" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="759" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2.5"/>
    <rect x="759" y="84" width="118" height="28" rx="6" fill="#168A53"/>
    <text x="818.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">RECONCILE</text>
    <text x="818.0" y="140" text-anchor="middle" font-weight="700" font-size="10.5">real Shopify</text>
    <text x="818.0" y="156" text-anchor="middle" font-weight="700" font-size="10.5">orders · ROAS</text>
    <line x1="771" y1="162" x2="865" y2="162" stroke="#DDD"/>
    <text x="818.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">not the</text>
    <text x="818.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">ad pixel</text>
  </g>
  <!-- feedback loop -->
  <path d="M 818.0 214 C 818.0 282, 230.0 282, 230.0 214" fill="none" stroke="#168A53" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="285" y="248" width="400" height="18" fill="#F7F4EC"/>
  <text x="485" y="261" text-anchor="middle" font-size="11" fill="#168A53" font-weight="700">winners and losers → context for the next round</text>
  <!-- spend control -->
  <g>
    <rect x="24" y="298" width="854" height="100" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="298" width="854" height="26" rx="6" fill="#2A2A2A"/>
    <text x="451" y="316" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">SPEND CONTROL — FOUR INDEPENDENT LAYERS</text>
    <text x="40" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">1. Every new ad created PAUSED</text>
    <text x="40" y="364" font-size="9.5" fill="#666">nothing spends until the</text>
    <text x="40" y="378" font-size="9.5" fill="#666">client activates it</text>
    <text x="253" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">2. Per-ad cap + monthly ceiling</text>
    <text x="253" y="364" font-size="9.5" fill="#666">enforced on live ads; past</text>
    <text x="253" y="378" font-size="9.5" fill="#666">the ceiling, no new campaigns</text>
    <text x="466" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">3. Estimate before every render</text>
    <text x="466" y="364" font-size="9.5" fill="#666">iterations capped; the price</text>
    <text x="466" y="378" font-size="9.5" fill="#666">is on the confirm card</text>
    <text x="679" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">4. Client's own Meta limit</text>
    <text x="679" y="364" font-size="9.5" fill="#666">a hard stop Meta enforces</text>
    <text x="679" y="378" font-size="9.5" fill="#666">regardless of this system</text>
  </g>
  <!-- footer -->
  <g>
    <rect x="0" y="420" width="900" height="58" fill="#168A53" opacity="0.08"/>
    <rect x="24" y="432" width="854" height="34" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2"/>
    <text x="44" y="453" font-size="12" fill="#168A53" font-weight="700">Everything that moves money is a proposal the client confirms — the model never acts alone.</text>
  </g>
  <!-- legend -->
  <g transform="translate(24, 490)">
    <rect x="0" y="0" width="14" height="14" fill="#168A53"/>
    <text x="20" y="12" font-size="11" fill="#2A2A2A">system-controlled / verified against real orders</text>
    <rect x="440" y="0" width="14" height="14" fill="#E67E22"/>
    <text x="460" y="12" font-size="11" fill="#2A2A2A">human gate — paused until the client approves</text>
  </g>
</svg>
