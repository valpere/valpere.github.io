<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="900" height="530" fill="#F7F4EC"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6E1D2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2A2A2A"/>
    </marker>
  </defs>
  <rect width="900" height="530" fill="url(#grid)"/>
  <!-- header -->
  <rect x="0" y="0" width="900" height="46" fill="#168A53"/>
  <text x="22" y="30" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="0.3">AI-РЕКЛАМНІ КАМПАНІЇ — SHOPIFY, ДИЗАЙНЕРСЬКИЙ ОДЯГ</text>
  <text x="878" y="30" fill="#FFFFFF" font-size="11" text-anchor="end">Go · PostgreSQL · Claude · Higgsfield · Meta</text>
  <!-- pipeline row -->
  <g font-size="11">
    <rect x="24" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="83.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">SHOPIFY</text>
    <text x="83.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">товари · склад</text>
    <text x="83.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">фото · замовлення</text>
    <line x1="36" y1="162" x2="130" y2="162" stroke="#DDD"/>
    <text x="83.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">GraphQL Admin API</text>
    <text x="83.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">+ живі вебхуки</text>
    <line x1="142" y1="149" x2="171" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="171" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="171" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="230.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">CLAUDE</text>
    <text x="230.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">оффер · кут</text>
    <text x="230.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">гіпотези гачків</text>
    <line x1="183" y1="162" x2="277" y2="162" stroke="#DDD"/>
    <text x="230.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">валідація за схемою</text>
    <text x="230.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">структурований вихід</text>
    <line x1="289" y1="149" x2="318" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="318" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="318" y="84" width="118" height="28" rx="6" fill="#E67E22"/>
    <text x="377.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">ЧАТ · БРИФ</text>
    <text x="377.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">узгодити бриф</text>
    <text x="377.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">підтвердити дії</text>
    <line x1="330" y1="162" x2="424" y2="162" stroke="#DDD"/>
    <text x="377.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">лише пропозиції —</text>
    <text x="377.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">підтверджує клієнт</text>
    <line x1="436" y1="149" x2="465" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="465" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="465" y="84" width="118" height="28" rx="6" fill="#2A2A2A"/>
    <text x="524.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">ВІДЕО</text>
    <text x="524.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">прев'ю 720p →</text>
    <text x="524.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">фінал 1080p</text>
    <line x1="477" y1="162" x2="571" y2="162" stroke="#DDD"/>
    <text x="524.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">монтаж ffmpeg,</text>
    <text x="524.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">звірка зі сценарієм</text>
    <line x1="583" y1="149" x2="612" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="612" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="612" y="84" width="118" height="28" rx="6" fill="#E67E22"/>
    <text x="671.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">META ADS</text>
    <text x="671.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">кампанія · ad set</text>
    <text x="671.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">оголошення PAUSED</text>
    <line x1="624" y1="162" x2="718" y2="162" stroke="#DDD"/>
    <text x="671.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">ліміти задано</text>
    <text x="671.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">до витрат</text>
    <line x1="730" y1="149" x2="759" y2="149" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="759" y="84" width="118" height="130" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2.5"/>
    <rect x="759" y="84" width="118" height="28" rx="6" fill="#168A53"/>
    <text x="818.0" y="103" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10.5">ЗВІРКА</text>
    <text x="818.0" y="140" text-anchor="middle" font-weight="700" font-size="9.5">замовлення</text>
    <text x="818.0" y="156" text-anchor="middle" font-weight="700" font-size="9.5">Shopify · ROAS</text>
    <line x1="771" y1="162" x2="865" y2="162" stroke="#DDD"/>
    <text x="818.0" y="180" text-anchor="middle" fill="#666" font-size="9.5">а не піксель</text>
    <text x="818.0" y="194" text-anchor="middle" fill="#666" font-size="9.5">реклами</text>
  </g>
  <!-- feedback loop -->
  <path d="M 818.0 214 C 818.0 282, 230.0 282, 230.0 214" fill="none" stroke="#168A53" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="285" y="248" width="400" height="18" fill="#F7F4EC"/>
  <text x="485" y="261" text-anchor="middle" font-size="11" fill="#168A53" font-weight="700">переможці й аутсайдери → контекст для наступного раунду</text>
  <!-- spend control -->
  <g>
    <rect x="24" y="298" width="854" height="100" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="298" width="854" height="26" rx="6" fill="#2A2A2A"/>
    <text x="451" y="316" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">КОНТРОЛЬ ВИТРАТ — ЧОТИРИ НЕЗАЛЕЖНІ РІВНІ</text>
    <text x="40" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">1. Кожне оголошення на паузі</text>
    <text x="40" y="364" font-size="9.5" fill="#666">нічого не витрачається,</text>
    <text x="40" y="378" font-size="9.5" fill="#666">доки клієнт не активує</text>
    <text x="253" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">2. Ліміт на оголошення + стеля</text>
    <text x="253" y="364" font-size="9.5" fill="#666">на живих оголошеннях; після</text>
    <text x="253" y="378" font-size="9.5" fill="#666">стелі нових кампаній немає</text>
    <text x="466" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">3. Оцінка перед рендером</text>
    <text x="466" y="364" font-size="9.5" fill="#666">ітерації обмежені; ціна</text>
    <text x="466" y="378" font-size="9.5" fill="#666">є на картці підтвердження</text>
    <text x="679" y="346" font-size="10.5" fill="#2A2A2A" font-weight="700">4. Ліміт клієнта в Meta</text>
    <text x="679" y="364" font-size="9.5" fill="#666">жорстка межа, яку тримає Meta</text>
    <text x="679" y="378" font-size="9.5" fill="#666">незалежно від системи</text>
  </g>
  <!-- footer -->
  <g>
    <rect x="0" y="420" width="900" height="58" fill="#168A53" opacity="0.08"/>
    <rect x="24" y="432" width="854" height="34" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2"/>
    <text x="44" y="453" font-size="12" fill="#168A53" font-weight="700">Усе, що рухає гроші, — пропозиція, яку підтверджує клієнт; модель сама не діє.</text>
  </g>
  <!-- legend -->
  <g transform="translate(24, 490)">
    <rect x="0" y="0" width="14" height="14" fill="#168A53"/>
    <text x="20" y="12" font-size="11" fill="#2A2A2A">під контролем системи / звірено з реальними замовленнями</text>
    <rect x="440" y="0" width="14" height="14" fill="#E67E22"/>
    <text x="460" y="12" font-size="11" fill="#2A2A2A">гейт людини — пауза, доки клієнт не затвердить</text>
  </g>
</svg>
