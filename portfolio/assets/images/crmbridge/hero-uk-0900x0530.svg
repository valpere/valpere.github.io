<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="900" height="530" fill="#F7F4EC"/>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6E1D2" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2A2A2A"/></marker></defs>
  <rect width="900" height="530" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="46" fill="#168A53"/>
  <text x="22" y="30" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="0.4">CRMBRIDGE — МАГАЗИН, ДЗВІНКИ І ПОСИЛКИ В CRM</text>
  <text x="878" y="30" fill="#FFFFFF" font-size="12" text-anchor="end">Go · SalesDrive · Binotel · Нова Пошта · SQLite</text>
  <g font-size="12">
    <rect x="24" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="24" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="99.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">МАГАЗИН · БОТ</text>
    <text x="99.0" y="140" text-anchor="middle" font-weight="700" font-size="12">id замовлення —</text>
    <text x="99.0" y="156" text-anchor="middle" font-weight="700" font-size="12">ключ унікальності</text>
    <line x1="38" y1="168" x2="160" y2="168" stroke="#DDD"/>
    <text x="99.0" y="186" text-anchor="middle" fill="#666" font-size="10">повторний запит</text>
    <text x="99.0" y="200" text-anchor="middle" fill="#666" font-size="10">нічого не дублює</text>
    <line x1="174" y1="155" x2="212" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="212" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
    <rect x="212" y="90" width="150" height="28" rx="6" fill="#E67E22"/>
    <text x="287.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">ЧЕРГА</text>
    <text x="287.0" y="140" text-anchor="middle" font-weight="700" font-size="12">повтор + backoff</text>
    <text x="287.0" y="156" text-anchor="middle" font-weight="700" font-size="12">пошук за ext. id</text>
    <line x1="226" y1="168" x2="348" y2="168" stroke="#DDD"/>
    <text x="287.0" y="186" text-anchor="middle" fill="#666" font-size="10">загублена відповідь</text>
    <text x="287.0" y="200" text-anchor="middle" fill="#666" font-size="10">не подвоїть угоду</text>
    <line x1="362" y1="155" x2="400" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="400" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="400" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="475.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">SALESDRIVE</text>
    <text x="475.0" y="140" text-anchor="middle" font-weight="700" font-size="12">угода · статус</text>
    <text x="475.0" y="156" text-anchor="middle" font-weight="700" font-size="12">нотатка · менеджер</text>
    <line x1="414" y1="168" x2="536" y2="168" stroke="#DDD"/>
    <text x="475.0" y="186" text-anchor="middle" fill="#666" font-size="10">одна угода</text>
    <text x="475.0" y="200" text-anchor="middle" fill="#666" font-size="10">на замовлення</text>
    <line x1="550" y1="155" x2="588" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="588" y="90" width="150" height="130" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect x="588" y="90" width="150" height="28" rx="6" fill="#2A2A2A"/>
    <text x="663.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="11">НОВА ПОШТА</text>
    <text x="663.0" y="140" text-anchor="middle" font-weight="700" font-size="12">пакетне опитування</text>
    <text x="663.0" y="156" text-anchor="middle" font-weight="700" font-size="12">лише вперед</text>
    <line x1="602" y1="168" x2="724" y2="168" stroke="#DDD"/>
    <text x="663.0" y="186" text-anchor="middle" fill="#666" font-size="10">до 100 ТТН</text>
    <text x="663.0" y="200" text-anchor="middle" fill="#666" font-size="10">за запит</text>
    <line x1="738" y1="155" x2="776" y2="155" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="776" y="90" width="102" height="130" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2.5"/>
    <rect x="776" y="90" width="102" height="28" rx="6" fill="#168A53"/>
    <text x="827.0" y="109" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="10">КЛІЄНТ</text>
    <text x="827.0" y="140" text-anchor="middle" font-weight="700" font-size="11">повідомлення</text>
    <text x="827.0" y="156" text-anchor="middle" font-weight="700" font-size="11">про статус</text>
    <line x1="790" y1="168" x2="864" y2="168" stroke="#DDD"/>
    <text x="827.0" y="186" text-anchor="middle" fill="#666" font-size="9">Telegram</text>
    <text x="827.0" y="200" text-anchor="middle" fill="#666" font-size="9"></text>
  </g>
  <rect x="24" y="270" width="852" height="112" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.5"/>
  <rect x="24" y="270" width="852" height="26" rx="6" fill="#2A2A2A"/>
  <text x="450" y="288" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="12" letter-spacing="0.6">ТЕЛЕФОНІЯ (BINOTEL) І ВЕБХУКИ</text>
  <text x="44" y="322" font-weight="700" font-size="12.5">дзвінок → картка клієнта</text>
  <text x="44" y="342" fill="#666" font-size="10.5">відповідальному</text>
  <text x="44" y="358" fill="#666" font-size="10.5">менеджеру</text>
  <text x="328" y="322" font-weight="700" font-size="12.5">пропущений → лід</text>
  <text x="328" y="342" fill="#666" font-size="10.5">повтор за 30 хв</text>
  <text x="328" y="358" fill="#666" font-size="10.5">додає нотатку</text>
  <text x="612" y="322" font-weight="700" font-size="12.5">вебхук SalesDrive</text>
  <text x="612" y="342" fill="#666" font-size="10.5">рано дізнається id угоди,</text>
  <text x="612" y="358" fill="#666" font-size="10.5">реєструє ТТН</text>
  <rect x="0" y="404" width="900" height="72" fill="#E4E7DA"/>
  <rect x="24" y="416" width="852" height="46" rx="6" fill="#FFFFFF" stroke="#168A53" stroke-width="2"/>
  <text x="44" y="444" fill="#168A53" font-weight="700" font-size="13">Статус посилки рухає угоду по воронці — лише вперед, ніколи назад.</text>
  <rect x="24" y="497" width="14" height="14" fill="#168A53"/>
  <text x="46" y="509" font-size="11" fill="#333">контроль системи</text>
  <rect x="404" y="497" width="14" height="14" fill="#E67E22"/>
  <text x="426" y="509" font-size="11" fill="#333">шлюз — без перевірки нічого не проходить</text>
</svg>
