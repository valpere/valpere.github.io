name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/endorphin-motion/package-lock.json

      # Next.js demo is built separately and copied into the finished Jekyll
      # output (after the Jekyll build: Jekyll skips underscore dirs like _next).
      - name: Build Endorphin demo
        working-directory: demos/endorphin-motion
        run: |
          npm ci
          NEXT_PUBLIC_BASE_PATH=/endorphin-demo npm run build
          npm run typecheck  # after build: next-env.d.ts imports generated .next/types

      - name: Add Endorphin demo to site
        run: |
          mkdir -p _site/endorphin-demo
          cp -r demos/endorphin-motion/out/. _site/endorphin-demo/
          test -d _site/endorphin-demo/_next

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
