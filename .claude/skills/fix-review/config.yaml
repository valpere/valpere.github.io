# fix-review multi-model configuration — valpere.github.io (Jekyll blog)
#
# Provider: Ollama via local daemon (http://localhost:11434).
# The local Ollama daemon is authenticated via device key and proxies
# :cloud model requests — no OLLAMA_API_KEY env var needed.
# See: https://docs.ollama.com/api/authentication

provider: ollama

reviewers:
  ollama_cloud:
    round_1:
      model: deepseek-v4-flash:cloud
      think: true
    round_2:
      model: qwen3.5:cloud
      think: false
    round_3:
      model: gemma4:31b-cloud
      think: false

  ollama_local:
    round_1:
      model: granite3.3:8b
    round_2:
      model: qwen2.5-coder:7b
    round_3:
      model: granite3.3:8b

  # Tier 2 — external agent CLIs, own free-tier subscriptions/logins,
  # entirely independent of Ollama's quota. Tried in this order per round;
  # first one that returns a non-empty result wins. Read-only invocations
  # only (lib/agents.sh) — replaces the old `cli:` block, which ran `agy`
  # with --dangerously-skip-permissions and `codex` with
  # --dangerously-bypass-approvals-and-sandbox (full write/bypass access
  # for a reviewer that only needs to read). `agy` and `gemini` dropped:
  # agy was evaluated upstream and excluded (explores the filesystem
  # instead of answering, not a prompt-wording issue — verified
  # 2026-07-29 in ~/wrk/common); gemini was never evaluated for read-only
  # invocation/output-format compatibility.
  external_agents:
    - { tool: cursor-agent, model: auto }
    - { tool: agy, model: "Gemini 3.5 Flash (Low)" }
    - { tool: omp }
    - { tool: codex }
    - { tool: opencode, model: "opencode/nemotron-3-ultra-free" }
    - { tool: kilo }

reviewer_set: cloud

# Both point to localhost — the daemon authenticates via device key.
ollama_api_url: http://localhost:11434/api/chat
ollama_api_url_local: http://localhost:11434/api/chat

arbiter: claude

diff_scope: delta
post_summary_to_pr: true

telemetry_enabled: true
telemetry_file: .claude/skills/fix-review/telemetry.jsonl
